<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup calibration</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 16px; background: #f4f6fb; color: #1b2440; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; background: #fff; padding: 6px; border-radius: 8px; box-shadow: 0 1px 4px #0002; }
  canvas { width: 340px; display: block; }
  figcaption { font-size: 13px; padding-top: 4px; }
  .bad { color: #b00020; font-weight: 600; }
  textarea { width: 100%; height: 220px; font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<h2>Mockup calibration</h2>
<p>Detects the value boxes on every mockup listed in <code>js/templates.js</code>. Check the red frames, then copy the
output into <code>js/layouts.js</code>.</p>
<div class="grid" id="grid"></div>
<h3>js/layouts.js</h3>
<textarea id="out" readonly></textarea>
<script src="../js/templates.js"></script>
<script src="detect.js"></script>
<script>
(async () => {
  const layouts = {};
  for (const t of TEMPLATES) {
    const img = await loadImage('../' + t.image);
    const det = analyzeMockup(img);
    const { fields, missing } = det;
    det.boxes = Object.keys(fields);
    layouts[t.id] = { width: det.W, height: det.H, fields };
    const c = document.createElement('canvas'); c.width = det.W; c.height = det.H;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.lineWidth = 3;
    for (const [k, f] of Object.entries(fields)) {
      g.strokeStyle = k === 'fluids' ? '#00a000' : '#ff0000';
      g.strokeRect(f.x - 2, f.y - 2, f.w + 4, f.h + 4);
      g.fillStyle = '#ff0000'; g.font = 'bold 14px Arial'; g.fillText(k, f.x, f.y - 5);
    }
    const fig = document.createElement('figure');
    fig.appendChild(c);
    const cap = document.createElement('figcaption');
    cap.innerHTML = `<b>${t.id}</b> (${det.W}x${det.H}) boxes=${det.boxes.length}` + (missing.length ? ` <span class="bad">missing: ${missing.join(', ')}</span>` : ' ✓');
    fig.appendChild(cap);
    document.getElementById('grid').appendChild(fig);
  }
  window.LAYOUT_RESULT = layouts;
  let s = '// Generated by tools/calibrate.html - pixel box of every value on every mockup.\n// Re-generate after adding or replacing a mockup image.\nconst LAYOUTS = {\n';
  for (const [k, v] of Object.entries(layouts)) {
    s += `  ${k}: { width: ${v.width}, height: ${v.height}, fields: {\n`;
    for (const [f, b] of Object.entries(v.fields)) s += `    ${f}: { x: ${b.x}, y: ${b.y}, w: ${b.w}, h: ${b.h}${b.border ? `, border: ${b.border}` : ''} },\n`;
    s += '  } },\n';
  }
  document.getElementById('out').value = s + '};\n';
})();
</script>
</body>
</html>
